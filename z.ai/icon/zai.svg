<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Z.ai - Smart Flow</title>
  <defs>
    <!-- 定义扫描遮罩 -->
    <mask id="scan-mask-layer">
      <!-- 
        这是一个移动的白色矩形，作为遮罩层。
        SMIL 动画 (animate) 让它从左向右循环移动，产生流光效果。
      -->
      <rect x="-100%" y="0" width="50%" height="100%" fill="white">
        <animate attributeName="x" from="-100%" to="200%" dur="2s" repeatCount="indefinite" />
      </rect>
    </mask>
  </defs>

  <!-- 1. 底层：低透明度的完整图标 (作为背景) -->
  <path opacity="0.2" fill="black" d="M12.105 2L9.927 4.953H.653L2.83 2h9.276zM23.254 19.048L21.078 22h-9.242l2.174-2.952h9.244zM24 2L9.264 22H0L14.736 2H24z"></path>

  <!-- 2. 顶层：应用了扫描遮罩的图标 (产生流光) -->
  <path mask="url(#scan-mask-layer)" fill="black" d="M12.105 2L9.927 4.953H.653L2.83 2h9.276zM23.254 19.048L21.078 22h-9.242l2.174-2.952h9.244zM24 2L9.264 22H0L14.736 2H24z"></path>
</svg>
