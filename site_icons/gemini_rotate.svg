<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <defs>
    <linearGradient id="star-gradient" x1="-33" y1="26" x2="31" y2="-28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgb(52,107,241)"/>
      <stop offset="22%" stop-color="rgb(50,121,248)"/>
      <stop offset="45%" stop-color="rgb(49,134,255)"/>
      <stop offset="72%" stop-color="rgb(64,147,255)"/>
      <stop offset="99%" stop-color="rgb(79,160,255)"/>
    </linearGradient>

    <linearGradient id="grad-blue-green" x1="0" y1="-16" x2="0" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="40%" stop-color="rgb(49,134,255)"/>
      <stop offset="54%" stop-color="rgb(24,149,219)"/>
      <stop offset="67%" stop-color="rgb(0,165,183)"/>
      <stop offset="82%" stop-color="rgb(7,176,139)"/>
      <stop offset="98%" stop-color="rgb(14,188,95)"/>
    </linearGradient>

    <linearGradient id="grad-green-yellow" x1="7.7" y1="-12.8" x2="12.8" y2="7.7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgb(14,188,95)"/>
      <stop offset="50%" stop-color="rgb(180,200,50)"/>
      <stop offset="100%" stop-color="rgb(255,215,0)"/>
    </linearGradient>

    <linearGradient id="grad-yellow-red" x1="7.7" y1="-12.8" x2="12.8" y2="7.7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgb(255,215,0)"/>
      <stop offset="50%" stop-color="rgb(255,140,0)"/>
      <stop offset="100%" stop-color="rgb(255,69,58)"/>
    </linearGradient>

    <style>
      /* 容器旋转动画：总时长4s，包含3圈 */
      .spinner-container {
        transform-origin: 16px 16px;
        animation: spin-cycle 4s linear infinite;
      }

      /* 旋转关键帧：控制每一圈的速度 */
      @keyframes spin-cycle {
        0%   { transform: rotate(0deg); }
        37.5%{ transform: rotate(360deg); } /* 第1圈结束 (1.5s) */
        75%  { transform: rotate(720deg); } /* 第2圈结束 (1.5s) */
        100% { transform: rotate(1080deg);} /* 第3圈结束 (1.0s) - 加速! */
      }

      /* 颜色切换逻辑：控制三段圆弧的显隐 */
      .arc-1 { animation: show-1 4s steps(1) infinite; }
      .arc-2 { animation: show-2 4s steps(1) infinite; }
      .arc-3 { animation: show-3 4s steps(1) infinite; }

      @keyframes show-1 { 0% { opacity: 1; } 37.5% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes show-2 { 0% { opacity: 0; } 37.5% { opacity: 1; } 75%   { opacity: 0; } }
      @keyframes show-3 { 0% { opacity: 0; } 75%   { opacity: 1; } 100%  { opacity: 0; } }
    </style>
  </defs>

  <g transform="matrix(0.08236795,-0.00009039,0.00009039,0.08236795,8.723052,8.739005)">
    <g transform="translate(88.25, 88.25)">
      <path fill="url(#star-gradient)" d="M-3.9,-84.95 C-5.28,-79.47 -7.08,-74.14 -9.32,-68.93 C-15.16,-55.37 -23.16,-43.5 -33.33,-33.33 C-43.5,-23.17 -55.37,-15.16 -68.93,-9.32 C-74.13,-7.08 -79.47,-5.28 -84.95,-3.9 C-86.74,-3.45 -88,-1.85 -88,0 C-88,1.85 -86.74,3.45 -84.95,3.9 C-79.47,5.28 -74.14,7.08 -68.93,9.32 C-55.37,15.16 -43.51,23.16 -33.33,33.33 C-23.16,43.5 -15.15,55.37 -9.32,68.93 C-7.08,74.13 -5.28,79.47 -3.9,84.95 C-3.45,86.74 -1.84,88 0,88 C1.85,88 3.45,86.74 3.9,84.95 C5.28,79.47 7.08,74.14 9.32,68.93 C15.16,55.37 23.16,43.51 33.33,33.33 C43.5,23.16 55.37,15.15 68.93,9.32 C74.13,7.08 79.47,5.28 84.95,3.9 C86.74,3.45 88,1.84 88,0 C88,-1.85 86.74,-3.45 84.95,-3.9 C79.47,-5.28 74.14,-7.08 68.93,-9.32 C55.37,-15.16 43.51,-23.16 33.33,-33.33 C23.16,-43.5 15.15,-55.37 9.32,-68.93 C7.08,-74.13 5.28,-79.47 3.9,-84.95 C3.45,-86.74 1.85,-88 0,-88 C-1.85,-88 -3.45,-86.74 -3.9,-84.95z"/>
    </g>
  </g>

  <g class="spinner-container">
    <g transform="translate(16, 16)">
      <path class="arc-1" stroke="url(#grad-blue-green)" stroke-linecap="round" stroke-width="2" fill="none" 
            d="M7.748,-12.844 C12.093,-10.215 15,-5.444 15,0 C15,2.844 14.206,5.505 12.829,7.772" />
      <path class="arc-2" stroke="url(#grad-green-yellow)" stroke-linecap="round" stroke-width="2" fill="none" 
            d="M7.748,-12.844 C12.093,-10.215 15,-5.444 15,0 C15,2.844 14.206,5.505 12.829,7.772" />
      <path class="arc-3" stroke="url(#grad-yellow-red)" stroke-linecap="round" stroke-width="2" fill="none" 
            d="M7.748,-12.844 C12.093,-10.215 15,-5.444 15,0 C15,2.844 14.206,5.505 12.829,7.772" />
    </g>
  </g>

</svg>
